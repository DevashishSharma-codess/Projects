<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Planner</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="Fullpage.css">
  <link rel="stylesheet" href="planner.css">
</head>

<body>
<main>

  <nav class="glass nav">
    <h2>Planner</h2>
  </nav>

  <section class="planner-layout">

    <!-- LEFT SIDE (FORM) -->
    <div class="planner-container glass">

      <div class="planner-header">
        <a href="index.html" class="back">Back</a>
        <h1>Daily Planner</h1>
        <span id="date"></span>
      </div>

      <!-- GOALS -->
      <div class="planner-box">
        <h3>Top Goals</h3>
        <input type="text" class="planner-input" placeholder="Goal 1">
        <input type="text" class="planner-input" placeholder="Goal 2">
        <input type="text" class="planner-input" placeholder="Goal 3">
      </div>

      <!-- SCHEDULE -->
      <div class="planner-box">
        <h3>Schedule</h3>
        <div class="schedule">
          <div class="time-row"><span>08:00</span><input type="text"></div>
          <div class="time-row"><span>10:00</span><input type="text"></div>
          <div class="time-row"><span>12:00</span><input type="text"></div>
          <div class="time-row"><span>14:00</span><input type="text"></div>
          <div class="time-row"><span>16:00</span><input type="text"></div>
          <div class="time-row"><span>18:00</span><input type="text"></div>
        </div>
      </div>

      <!-- TASKS -->
      <div class="planner-box">
        <h3>Tasks</h3>

        <div class="task-row">
          <input type="text" id="taskInput" placeholder="New task">
          <select id="priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
          <button id="addTask">Add</button>
        </div>

        <div class="task-list"></div>
      </div>

      <!-- NOTES -->
      <div class="planner-box">
        <h3>Notes</h3>
        <textarea id="notes" placeholder="Write notes..."></textarea>
      </div>

      <button class="save-btn" id="saveDay">Save Day</button>

    </div>

    <!-- RIGHT SIDE (SAVED DATA) -->
    <div class="saved-panel glass">
      <h2>Saved Plans</h2>
      <div id="savedList"></div>
    </div>

  </section>

</main>
</body>
<script src="planner.js"></script>
</html>
